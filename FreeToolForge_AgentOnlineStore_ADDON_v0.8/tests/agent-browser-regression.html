<!doctype html><meta name="viewport" content="width=device-width"><title>Agent Online Store Browser Regression</title><iframe id="app" src="/agent/"></iframe><script>window.addEventListener('load',()=>{const w=document.getElementById('app').contentWindow;const real=w.fetch.bind(w);const spec={refusal:null,slug:'browser-regression-page',title:'Browser Regression Page',summary:'A deterministic browser regression page used for the Agent Online Store workspace.',blocks:[{type:'hero',title:'Browser Regression Page',subtitle:'Sandbox render'},{type:'list',title:'Checks',items:['render','interaction','publish boundary']},{type:'calculator',key:'calc',title:'Percentage',operation:'percentage',labels:['Value','Percent']}],tests:[{action:'assert-text',text:'Browser Regression Page'},{action:'assert-blocks',minimum:3},{action:'calculator-smoke',key:'calc'}]};w.fetch=async(u,o)=>{if(String(u)==='/api/agent-plan')return new Response(JSON.stringify({spec}),{headers:{'Content-Type':'application/json'}});if(String(u)==='/api/agent-publish')return new Response(JSON.stringify({ok:true,path:'data/agent-pages/browser-regression-page.json',commit:'0000000'}),{headers:{'Content-Type':'application/json'}});return real(u,o)};w.document.getElementById('prompt').value='build regression';w.document.getElementById('build').click();setTimeout(()=>document.body.dataset.result=w.document.getElementById('test-state').textContent,1800)})</script>
