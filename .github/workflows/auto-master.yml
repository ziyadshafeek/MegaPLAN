name: Scheduled directory indexing

on:
  schedule:
    - cron: '*/20 * * * *' # Every 20 minutes
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch size for each scraper'
        default: '10'
        type: string

jobs:
  auto-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci || npm install
      - name: Run verifiable map, product, and music indexing
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "Running scheduled indexing (upstream failures are not successful ingestions)"
          # Map — Kerala 10-day sprint
          echo "=== Map Kerala ==="
          node scripts/kerala-expansion-runner.mjs --batch 10 --workers 2
          # Product — experimental Flipkart search
          echo "=== Product ==="
          node scripts/product-scraper-runner.mjs --batch 20 --platform flipkart --category mobiles
          node scripts/product-scraper-runner.mjs --batch 20 --platform flipkart --category laptops
          # Music — Spotify
          echo "=== Music ==="
          node scripts/music-scraper-runner.mjs --batch 30 --query love
          node scripts/music-scraper-runner.mjs --batch 30 --query malayalam
      - name: Commit all
        run: |
          git config user.name "auto-master-bot"
          git config user.email "bot@megaplan.local"
          git add data/ public/data/
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          MAP=$(jq -r '.totalCells // 0' data/map-directory/index.json 2>/dev/null || echo "0")
          PROD=$(jq -r '.totalProducts // 0' data/product-directory/index.json 2>/dev/null || echo "0")
          MUSIC=$(jq -r '.totalTracks // 0' data/music-directory/index.json 2>/dev/null || echo "0")
          git commit -m "auto-master: fully automatic map ${MAP} cells, product ${PROD}, music ${MUSIC} [skip ci]"
          git push origin HEAD:${{ github.ref_name || 'main' }}
      - name: Summary
        run: |
          echo "### 🤖 Scheduled indexing" >> $GITHUB_STEP_SUMMARY
          echo "Map: $(jq -r '.totalCells // 0' data/map-directory/index.json) cells" >> $GITHUB_STEP_SUMMARY
          echo "Product: $(jq -r '.totalProducts // 0' data/product-directory/index.json) products" >> $GITHUB_STEP_SUMMARY
          echo "Music: $(jq -r '.totalTracks // 0' data/music-directory/index.json) tracks" >> $GITHUB_STEP_SUMMARY
          echo "Free storage: GitHub + Vercel + IndexedDB, fully indexable for AI" >> $GITHUB_STEP_SUMMARY
