name: Authorized retailer listing feed sync
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-directory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  licensed-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync operator-authorized JSON feed (if configured)
        env:
          PRODUCT_FEED_URL: ${{ secrets.PRODUCT_FEED_URL }}
          PRODUCT_FEED_TOKEN: ${{ secrets.PRODUCT_FEED_TOKEN }}
          PRODUCT_FEED_PERMISSION_URL: ${{ vars.PRODUCT_FEED_PERMISSION_URL }}
          PRODUCT_RETAILER_DOMAIN: ${{ vars.PRODUCT_RETAILER_DOMAIN }}
        run: node scripts/sync-product-feed.mjs
      - name: Save authorized feed for review (NOT publication)
        uses: actions/upload-artifact@v4
        with:
          name: authorized-product-review-${{ github.run_id }}
          path: |
            data/product-directory/
            public/data/product-directory/
          if-no-files-found: error
          retention-days: 7
      - name: Report coverage
        if: always()
        run: |
          echo 'Retailer listings require authorized feed access and redistribution rights. No Flipkart/Amazon HTML scraping is scheduled. Publication is pending human PR review.' >> "$GITHUB_STEP_SUMMARY"
          jq '{totalProducts,lastScannedAt,source}' data/product-directory/index.json >> "$GITHUB_STEP_SUMMARY"
