name: Licensed image-link candidates (manual review required)
on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: open-directory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Search licensed, marked-non-mature Wikimedia metadata
        run: node scripts/image-links-runner.mjs
      - name: Publish candidate metadata to Git, NEVER public image index
        run: |
          git config user.name 'megaplan-collector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/image-links/candidates.json
          if git diff --cached --quiet; then echo 'No new verified metadata'; exit 0; fi
          git commit -m 'data: refresh image-link candidates requiring review [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Review required
        run: echo 'No candidates automatically appear on the site. A human must check maturity, copyright and license and approve each link.' >> "$GITHUB_STEP_SUMMARY"
