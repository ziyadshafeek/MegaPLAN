name: Resumable open song-name collection (no audio)
on:
  # GitHub schedules run only the workflow on the default branch after merge.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: open-directory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Jitter to avoid synchronized provider load
        run: sleep $((RANDOM % 45))
      - name: Fetch 3 paged MusicBrainz recording-name batches (at most 1 request per 1.2s)
        run: node scripts/open-music-runner.mjs
      - name: Publish metadata and resumable cursor, never audio
        run: |
          git config user.name 'megaplan-collector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/music-directory public/data/music-directory
          if git diff --cached --quiet; then echo 'No verified new music metadata'; exit 0; fi
          git commit -m 'data: append verified open song metadata [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report coverage accurately
        if: always()
        run: |
          echo 'This is a bounded MusicBrainz search sample, not every Spotify song. The full catalog requires an official dump and external index.' >> "$GITHUB_STEP_SUMMARY"
          jq '{totalTracks,lastScannedAt,coverage}' data/music-directory/index.json >> "$GITHUB_STEP_SUMMARY"
