name: Music Directory Auto Scraper — verified Spotify results

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      batch:
        description: 'Tracks to scrape per run'
        default: '100'
        type: string
      query:
        description: 'Search query'
        default: 'love'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci || npm install
      - name: Run music scraper
        run: |
          BATCH="${{ inputs.batch || '100' }}"
          QUERY="${{ inputs.query || 'love' }}"
          echo "Scraping $BATCH tracks for query $QUERY"
          node scripts/music-scraper-runner.mjs --batch $BATCH --query $QUERY
      - name: Commit
        run: |
          git config user.name "music-scraper-bot"
          git config user.email "bot@megaplan.local"
          git add data/music-directory/ public/data/music-directory/ || true
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          TOTAL=$(jq -r '.totalTracks // 0' data/music-directory/index.json 2>/dev/null || echo "0")
          git commit -m "music: auto scrape batch ${{ inputs.batch || '100' }} query ${{ inputs.query || 'love' }} total ${TOTAL} [skip ci]"
          git push origin HEAD:${{ github.ref_name || 'main' }}
