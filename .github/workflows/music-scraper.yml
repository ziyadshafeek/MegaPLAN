name: Open music metadata (MusicBrainz, not Spotify)

on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect licensed open metadata (bounded)
        run: node scripts/open-music-runner.mjs
      - name: Commit verified open records
        run: |
          git config user.name 'megaplan-collector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/music-directory/index.json public/data/music-directory/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update open MusicBrainz snapshot [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
