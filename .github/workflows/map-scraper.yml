name: Bounded OSM collection for review
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-directory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect bounded records and measure distinct IDs
        run: node scripts/collection-review.mjs map
      - name: Save review artifact (NOT publication)
        uses: actions/upload-artifact@v4
        with:
          name: map-review-${{ github.run_id }}
          path: collection-review-output/
          if-no-files-found: error
          retention-days: 7
      - name: Report collection versus publication
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Collection/review artifact job: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication: pending human PR review. This job cannot push or deploy data.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f collection-review-output/report.json ]; then cat collection-review-output/report.json >> "$GITHUB_STEP_SUMMARY"; fi
