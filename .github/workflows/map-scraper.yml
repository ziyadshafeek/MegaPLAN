name: Map Directory Auto Scraper — Trivandrum Origin

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Cells to scan per run'
        required: false
        default: '10'
        type: string
      start_index:
        description: 'Start index (leave empty for auto)'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read last index
        id: last
        run: |
          if [ -f data/map-directory/index.json ]; then
            LAST=$(jq -r '.lastIndex // -1' data/map-directory/index.json)
            echo "last=$LAST" >> $GITHUB_OUTPUT
            echo "Last index: $LAST"
          else
            echo "last=-1" >> $GITHUB_OUTPUT
            echo "No index, starting from -1"
          fi

      - name: Install deps
        run: npm ci || npm install

      - name: Run scraper (batch)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_AGENT_MODEL: ${{ secrets.NVIDIA_AGENT_MODEL || 'deepseek-ai/deepseek-v4.1-flash' }}
        run: |
          BATCH="${{ inputs.batch || '10' }}"
          START="${{ inputs.start_index }}"
          if [ -z "$START" ]; then
            START=$((${{ steps.last.outputs.last }} + 1))
          fi
          echo "Scanning $BATCH cells starting from $START"
          node scripts/map-scraper-runner.mjs --start $START --batch $BATCH

      - name: Commit new data
        run: |
          git config user.name "map-scraper-bot"
          git config user.email "bot@megaplan.local"
          git add data/map-directory/ public/data/map-directory/ || true
          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          TOTAL=$(jq -r '.totalCells // 0' data/map-directory/index.json 2>/dev/null || echo "0")
          PLACES=$(jq -r '.totalPlaces // 0' data/map-directory/index.json 2>/dev/null || echo "0")
          git commit -m "map: auto scrape Trivandrum batch ${{ inputs.batch || '10' }} cells, total ${TOTAL} cells ${PLACES} places [skip ci]"
          git push origin HEAD:${{ github.ref_name || 'main' }}

      - name: Summary
        run: |
          if [ -f data/map-directory/index.json ]; then
            echo "### Map Directory Stats" >> $GITHUB_STEP_SUMMARY
            cat data/map-directory/index.json | jq '{totalCells, totalPlaces, lastIndex, lastScannedAt, businessTypes: (.businessTypes | keys | length), roads: (.roadWise | keys | length), religious}' >> $GITHUB_STEP_SUMMARY
          fi
