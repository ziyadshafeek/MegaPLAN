<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wiki page — MegaPLAN</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body style="background:#f4efe6">
  <header class="a-appbar" style="max-width:900px;margin:0 auto">
    <a href="/">← Desk</a>
    <h1 id="title">Page</h1>
    <a href="/agent/">Wiki Agent</a>
  </header>
  <main style="max-width:900px;margin:0 auto;padding:12px 16px 48px">
    <article id="page" class="panel"></article>
  </main>
  <script type="module">
    import { previewHtml } from '/agent/agent.js';
    const slug = new URLSearchParams(location.search).get('slug');
    const titleEl = document.getElementById('title');
    const page = document.getElementById('page');
    try {
      if (!/^[a-z0-9]+(?:-[a-z0-9]+){2,69}$/.test(slug || '')) throw Error('Invalid slug');
      let spec = null;
      try { spec = JSON.parse(localStorage.getItem('mp-wiki-' + slug) || 'null'); } catch {}
      if (!spec) {
        const r = await fetch('/data/agent-pages/' + encodeURIComponent(slug) + '.json', { cache: 'no-store' });
        if (!r.ok) throw Error('Page not found on this device or on the published wiki.');
        spec = await r.json();
      }
      document.title = spec.title + ' — MegaPLAN';
      titleEl.textContent = spec.title;
      page.innerHTML = '<iframe title="Wiki page" sandbox="allow-scripts" style="width:100%;min-height:70vh;border:0;border-radius:12px;background:#fffaf2"></iframe>';
      page.querySelector('iframe').srcdoc = previewHtml(spec);
    } catch (e) { page.textContent = e.message; }
  </script>
</body>
</html>
