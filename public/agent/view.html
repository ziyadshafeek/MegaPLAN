<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Wiki Page — FreeToolForge</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/agent/agent.css"></head><body class="agent-app"><header class="os-topbar"><div class="crumb"><a href="/agent/">Agent Online Store</a><span>/</span><b id="title">Page</b></div><a class="command" href="/">Tools</a></header><main style="background:#f5f7fb;color:#101828;min-height:calc(100dvh - 48px);padding:24px"><article id="page" style="max-width:900px;margin:auto;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:24px"></article></main><script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=b=>{if(b.type==='hero')return `<section><div style="font-size:9px;letter-spacing:.12em;color:#667085;font-weight:800">AGENT WIKI</div><h1 style="font-size:46px;line-height:1.05;letter-spacing:-.06em">${esc(b.title)}</h1><p>${esc(b.subtitle)}</p></section>`;if(b.type==='text')return `<section><h2>${esc(b.title||'')}</h2><p>${esc(b.body)}</p></section>`;if(b.type==='markdown')return `<section><p>${esc(b.body).replace(/\n/g,'<br>')}</p></section>`;if(b.type==='list')return `<section><h2>${esc(b.title||'')}</h2><ul>${(b.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;if(b.type==='table')return `<section><h2>${esc(b.title||'')}</h2><div style="overflow:auto"><table><thead><tr>${(b.columns||[]).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;if(b.type==='note')return `<aside style="padding:12px;border:1px solid #e4e7ec;border-radius:10px;background:#f8fafc">${esc(b.body)}</aside>`;if(b.type==='tool-link')return `<section><a href="/tools/${encodeURIComponent(b.slug)}" style="display:inline-block;background:#101828;color:#fff;padding:10px 12px;border-radius:8px;text-decoration:none">${esc(b.title)} ↗</a></section>`;if(b.type==='faq')return `<section><h2>FAQ</h2>${(b.items||[]).map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('')}</section>`;if(b.type==='calculator')return `<section style="padding:14px;border:1px solid #e4e7ec;border-radius:12px;background:#f8fafc"><h2>${esc(b.title||'Calculator')}</h2><input id="a" type="number" placeholder="${esc(b.labels?.[0]||'Value A')}"><input id="b" type="number" placeholder="${esc(b.labels?.[1]||'Value B')}"><button id="run">Calculate</button><pre id="out"></pre></section>`;return ''};
(async()=>{try{const slug=new URLSearchParams(location.search).get('slug');if(!/^[a-z0-9]+(?:-[a-z0-9]+){2,69}$/.test(slug||''))throw Error('Invalid slug');const r=await fetch('/data/agent-pages/'+encodeURIComponent(slug)+'.json',{cache:'no-store'});if(!r.ok)throw Error('Page not found');const s=await r.json();document.title=s.title+' — FreeToolForge';document.getElementById('title').textContent=s.title;document.getElementById('page').innerHTML=(s.blocks||[]).map(B).join('');if(s.blocks?.some(x=>x.type==='calculator')){const op=s.blocks.find(x=>x.type==='calculator').operation;document.getElementById('run').onclick=()=>{const a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value);let v;switch(op){case'percentage':v=a*b/100;break;case'discount':v=a-a*b/100;break;case'tip':case'gst':v=a+a*b/100;break;case'bmi':v=b>0?a/(b*b):NaN;break;case'markup':v=a*(1+b/100);break;case'margin':v=a?((a-b)/a)*100:NaN;break;case'profit':v=a-b;break;case'break-even':v=b?Math.ceil(a/b):NaN;break}document.getElementById('out').textContent=Number.isFinite(v)?String(Math.round(v*10000)/10000):'Check inputs'}}}catch(e){document.getElementById('page').textContent=e.message}})();
</script></body></html>
